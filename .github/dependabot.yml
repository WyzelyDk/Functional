# Keeps the GitHub Actions and the NuGet packages up to date. Every update arrives as a pull request, so the CI gate decides whether it
# is safe; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      analyzers:
        patterns:
          - 'StyleCop.Analyzers'
          - 'SonarAnalyzer.CSharp'
          - 'AsyncFixer'
          - 'Microsoft.CodeAnalysis.*'
      xunit:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'Microsoft.Testing.*'

  # The documentation tools (MkDocs and its theme) are pinned in .github/mkdocs/requirements.txt; this proposes their updates as pull requests.
  # MkDocs is held at 1.x on purpose (see the note in that file), so a new major version is ignored until that is decided.
  - package-ecosystem: pip
    directory: /.github/mkdocs
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mkdocs
        update-types: ['version-update:semver-major']
