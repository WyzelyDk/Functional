name: Publish

# Publishes ONE package to nuget.org when a release tag is pushed. Every package has its own tag prefix (the MinVerTagPrefix of its
# project), so the tag says which package to release and, through MinVer, which version:
#
#   result-v1.2.3            ->  Wyzely.Functional.Result 1.2.3
#   result-v1.3.0-preview.1  ->  Wyzely.Functional.Result 1.3.0-preview.1 (a prerelease)
#
# The tag must point at a commit that is on main. See docs/releasing.md for the one-time GitHub and nuget.org setup.
on:
  push:
    tags:
      - '*-v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      prefix: ${{ steps.package.outputs.prefix }}
      package-id: ${{ steps.package.outputs.packageId }}
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      # MinVer needs the whole history and every tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge through a pull request first, then tag main."
            exit 1
          fi

      # global.json pins the SDK (11, which builds every target framework, so the package contains the net11.0 asset; see ci.yml). The
      # runtimes of .NET 8 and 10 are added because the net8.0 and net10.0 tests need them.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      # Maps the tag to a package (and refuses a tag that is not a well-formed release tag of exactly one package).
      - name: Resolve the package from the tag
        id: package
        shell: pwsh
        run: ./.github/scripts/Resolve-Package.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Restore
        run: dotnet restore Wyzely.Functional.slnx

      - name: Build (no errors, no warnings)
        run: dotnet build Wyzely.Functional.slnx --configuration Release --no-restore -warnaserror

      # The same tests as a pull request: nothing is published from a commit whose tests do not pass.
      - name: Test
        run: dotnet test --solution Wyzely.Functional.slnx --configuration Release --no-build

      - name: Pack ${{ steps.package.outputs.packageId }}
        run: >
          dotnet pack "${{ steps.package.outputs.project }}"
          --configuration Release --no-build
          -p:PackageOutputPath="${{ github.workspace }}/artifacts"

      # MinVer must have produced exactly the version that the tag names.
      - name: The package must carry the version of the tag
        run: |
          expected="${{ steps.package.outputs.packageId }}.${{ steps.package.outputs.version }}.nupkg"
          ls -l artifacts
          if [ ! -f "artifacts/$expected" ]; then
            echo "::error::Expected artifacts/$expected, but MinVer produced something else. Is the tag on the commit that was built?"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is where a human approves the release and where the trusted publishing policy on nuget.org is anchored.
    environment: nuget
    permissions:
      id-token: write # lets this job ask GitHub for an OIDC token, which nuget.org exchanges for a one-hour API key
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No stored API key: nuget.org checks that this repository, workflow file and environment match a trusted publishing policy and
      # returns a key that is valid for one hour. NUGET_USER is the nuget.org profile name (not an email address).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the package and its symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: Create the GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Release notes list the pull requests since the previous release OF THE SAME PACKAGE, not of the whole repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PREFIX: ${{ needs.build.outputs.prefix }}
          PACKAGE_ID: ${{ needs.build.outputs.package-id }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          previous=$(git tag --list "${PREFIX}*" --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
          args=(--title "$PACKAGE_ID $VERSION" --generate-notes --verify-tag)
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" artifacts/* "${args[@]}"
