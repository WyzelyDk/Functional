name: CI

# Every pull request into main, and every push to main, must build without errors or warnings and pass all tests.
#
# One workflow covers the whole repository, and it ALWAYS starts: branch protection requires the single check "CI" (the gate job at the
# end), and a workflow that never starts would leave that check pending forever. A pull request that changes nothing but documentation
# therefore still runs, but the `changes` job notices and the build and test jobs are skipped; only the link check runs. See
# .github/scripts/Test-CodeChanged.ps1 for what counts as documentation, and docs/releasing.md for the reasoning.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group: # only used if the merge queue is enabled for the repository

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Did anything other than documentation change? If not, the build and the tests have nothing new to prove.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # The whole history, so that the commit to compare with is available.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether code changed
        id: detect
        shell: pwsh
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # A push to main publishes the website (the `pages` job), and the website contains the coverage report, so a push to main always
          # builds and tests, even when it changes only documentation. That is one build per merge; pull requests still skip it.
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              Write-Host 'code=true  (a push to main publishes the website)'
              'code=true' | Add-Content -Path $env:GITHUB_OUTPUT

              return
          }

          # A pull request is checked as the merge commit it would become; its first parent is the target branch, so the diff against
          # it is exactly the change of the pull request.
          $base = switch ($env:GITHUB_EVENT_NAME) {
              'pull_request' { (git rev-parse "$($env:GITHUB_SHA)^1").Trim() }
              'merge_group'  { $env:MERGE_GROUP_BASE }
              default        { $env:EVENT_BEFORE }
          }

          ./.github/scripts/Test-CodeChanged.ps1 -Base $base -Head $env:GITHUB_SHA

  # Always runs and takes well under a minute: a documentation-only change is not built, but its links are checked and the documentation
  # site must build without a warning (a broken anchor, a page missing from the nav), so that publishing it cannot fail after the merge.
  docs:
    name: Check the Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the relative links
        shell: pwsh
        run: ./.github/scripts/Test-MarkdownLinks.ps1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/mkdocs/requirements.txt

      - name: Install MkDocs
        run: |
          pip install --require-hashes --only-binary :all: -r .github/mkdocs/requirements.txt

      - name: Build the documentation site (no warnings)
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  validate:
    name: Validate the repository and its pipeline
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # All packages are released together by one tag, so no packable project may set a tag prefix of its own.
      - name: Check the release tag prefixes
        shell: pwsh
        run: ./.github/scripts/Resolve-Package.ps1 -Validate

      # The tag decides which packages are published, and in which order, so the resolution is tested.
      - name: Test the release tag resolution
        shell: pwsh
        run: ./.github/scripts/Resolve-Package.Tests.ps1

      # The change detection decides what is verified at all, so it is tested.
      - name: Test the change detection
        shell: pwsh
        run: ./.github/scripts/Test-CodeChanged.Tests.ps1

      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  build-and-test:
    name: Build and test
    needs: [changes, validate]
    if: needs.changes.outputs.code == 'true'
    # Linux only: the libraries are pure managed code with no operating-system calls, and the generated files and line endings are
    # normalised by the tests, so a second operating system would repeat the same result at twice the cost.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # MinVer reads the tags and the history, so the clone must not be shallow.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # global.json pins the SDK (11, which builds every target framework); the runtimes of .NET 8 and 10 are added because the net8.0 and
      # net10.0 tests need them. While SDK 11 is a release candidate its version is pinned there, so that a new candidate cannot break every
      # pull request by surprise; bump it deliberately. After general availability pin the stable 11.0.x.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Wyzely.Functional.slnx

      # Release treats warnings as errors; the flag only makes that explicit.
      - name: Build (no errors, no warnings)
        run: dotnet build Wyzely.Functional.slnx --configuration Release --no-restore -warnaserror

      # Runs every test project on every target framework it has (net8.0, net10.0 and net11.0), and collects coverage.
      - name: Test with coverage
        run: dotnet test --solution Wyzely.Functional.slnx --configuration Release --no-build --coverage --coverage-output-format cobertura

      # Proves that the packages can be produced and that they contain the net11.0 asset.
      - name: Pack (smoke test)
        run: dotnet pack Wyzely.Functional.slnx --configuration Release --no-build -p:PackageOutputPath="${{ github.workspace }}/artifacts"

      - name: List the package contents
        run: |
          for package in artifacts/*.nupkg; do
            echo "== $package"
            unzip -l "$package" | awk '{print $4}' | grep -E '\.dll$|README\.md$' || true
          done

      # Each test project and target framework writes TestResults/<guid>.cobertura.xml; ReportGenerator merges them. The summary needs
      # no account, no token and no permissions, so it also works for pull requests from forks.
      - name: Merge the coverage reports
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: '**/TestResults/*.cobertura.xml'
          targetdir: ${{ runner.temp }}/coveragereport
          reporttypes: 'Html;Badges;MarkdownSummaryGithub'
          assemblyfilters: '-*Tests*;-*Benchmarks*'

      - name: Show the coverage in the run summary
        run: cat "${{ runner.temp }}/coveragereport/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coveragereport
          retention-days: 14

      # On main, the documentation site and the coverage report become one GitHub Pages site: the docs at the root, the coverage report
      # (and the badges in the READMEs) under /coverage/. A repository has only one Pages site, so both are packaged here and deployed by
      # the `pages` job. Never for a pull request: the site and the badges must show main.
      - uses: actions/setup-python@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/mkdocs/requirements.txt

      - name: Build the website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pip install --require-hashes --only-binary :all: -r .github/mkdocs/requirements.txt
          mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
          cp -r "$RUNNER_TEMP/coveragereport" "$RUNNER_TEMP/site/coverage"

      - name: Package the website for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  # SonarCloud analysis: static analysis, code coverage and the quality gate. The scanner wraps a build and the tests (the begin step changes
  # the build, so this is a job of its own and the warnings-as-errors build above stays untouched). `sonar.qualitygate.wait` makes the `end`
  # step fail when the quality gate fails, so this job, and with it the required check `CI`, is red then.
  # The token is not available to pull requests from forks, which cannot be analysed; a missing token anywhere else is an error. For pull
  # requests of Dependabot, add SONAR_TOKEN as a Dependabot secret as well (Settings -> Secrets and variables -> Dependabot).
  sonarcloud:
    name: SonarCloud analysis
    needs: [changes, validate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check that the SonarCloud token is available
        id: token
        env:
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$FROM_FORK" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This pull request comes from a fork, so the SonarCloud token is not available and the analysis is skipped."
          else
            echo "::error::The secret SONAR_TOKEN is not available. Add it as a repository secret (and as a Dependabot secret)."
            exit 1
          fi

      # The whole history: SonarCloud needs it for blame information and to find new code.
      - uses: actions/checkout@v7
        if: steps.token.outputs.available == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        if: steps.token.outputs.available == 'true'
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v6
        if: steps.token.outputs.available == 'true'
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The scanner downloads its analysis engine on first use.
      - uses: actions/cache@v6
        if: steps.token.outputs.available == 'true'
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # dotnet-tools.json pins the scanner.
      - name: Restore the scanner
        if: steps.token.outputs.available == 'true'
        run: dotnet tool restore

      # Coverage is the Cobertura files that the tests write (TestResults/<guid>.cobertura.xml). What is measured is the code that the tests are there to
      # protect: the libraries, the analyzers and their code fixes, and the generator with the engine that it shares. The samples, the benchmarks and the
      # scripts and the documentation hook in .github/ are excluded, because they are not tested line by line. SonarCloud leaves out generated files
      # (*.g.cs) on its own: their coverage comes from the generated tests, and the generator that writes them is measured. The benchmarks (one scenario
      # per compared library) and the generator tools are left out of the duplication check.
      - name: Begin the analysis
        if: steps.token.outputs.available == 'true'
        run: >
          dotnet sonarscanner begin
          /k:"WyzelyDk_Functional"
          /o:"wyzelydk"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.cobertura.reportsPaths="**/TestResults/*.cobertura.xml"
          /d:sonar.coverage.exclusions="samples/**,benchmarks/**,.github/**"
          /d:sonar.cpd.exclusions="benchmarks/**,src/*.CodeGeneration/**"
          /d:sonar.exclusions="assets/**"
          /d:sonar.python.version=3.13
          /d:sonar.qualitygate.wait=true

      # Warnings are not errors here: the scanner adds the rules of the SonarCloud profile, which the pinned analyzer may not know.
      - name: Build
        if: steps.token.outputs.available == 'true'
        run: >
          dotnet build Wyzely.Functional.slnx --configuration Release --no-incremental --disable-build-servers
          -p:TreatWarningsAsErrors=false -p:MSBuildTreatWarningsAsErrors=false

      - name: Test with coverage
        if: steps.token.outputs.available == 'true'
        run: dotnet test --solution Wyzely.Functional.slnx --configuration Release --no-build --coverage --coverage-output-format cobertura

      - name: End the analysis and wait for the quality gate
        if: steps.token.outputs.available == 'true'
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # "AOT compatible" is something that is run, not claimed: all three libraries are published as a Native AOT app, which must produce
  # no trim or AOT warning (warnings are errors in Release), and the binary must then pass its own checks.
  aot:
    name: Native AOT (publish and run)
    needs: [changes, validate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish as Native AOT (no errors, no warnings)
        run: dotnet publish samples/Aot.Samples/Aot.Samples.csproj --configuration Release --runtime linux-x64 --output artifacts/aot

      - name: Run the native binary
        run: ./artifacts/aot/Wyzely.Functional.Aot.Samples

  # Deploys the website that `build-and-test` packaged, after a push to main. It is not part of the gate: a Pages problem must never block a
  # pull request. One-time setup: Settings -> Pages -> Source: GitHub Actions.
  pages:
    name: Publish the website
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The one check that branch protection requires. It always runs, and it fails unless the right jobs succeeded:
  #  - `changes` and `docs` must always succeed;
  #  - the build and test jobs must succeed when code changed, and may be skipped only when nothing but documentation changed.
  gate:
    name: CI
    if: always()
    needs: [changes, docs, validate, build-and-test, sonarcloud, aot]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          ALWAYS: ${{ needs.changes.result }} ${{ needs.docs.result }}
          WHEN_CODE_CHANGED: ${{ needs.validate.result }} ${{ needs.build-and-test.result }} ${{ needs.sonarcloud.result }} ${{ needs.aot.result }}
        run: |
          echo "Code changed: $CODE_CHANGED"
          echo "Always required: $ALWAYS"
          echo "Required when code changed: $WHEN_CODE_CHANGED"

          for result in $ALWAYS; do
            if [ "$result" != "success" ]; then
              echo "::error::A job that must always succeed did not ($result)."
              exit 1
            fi
          done

          for result in $WHEN_CODE_CHANGED; do
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$CODE_CHANGED" = "false" ]; then continue; fi
            echo "::error::A build or test job did not succeed ($result) although code changed."
            exit 1
          done
